// ============ 渲染逻辑 ============
const catsEl = document.getElementById("cats");
const listEl = document.getElementById("list");
const statEl = document.getElementById("stat");
const qEl = document.getElementById("q");

// 分类树：分类 → 子分组（从数据生成）
const CATS = [
  { key:"all", label:"全部", filter:null },
  { key:"渲染引擎", label:"⭐ 渲染引擎 v1.0.2", filter:c=>c.cat==="渲染引擎" },
  { key:"逻辑系统", label:"逻辑系统 v1.0.2", filter:c=>c.cat==="逻辑系统" },
  { key:"应用与核心", label:"应用与渲染核心", filter:c=>c.cat==="应用与核心" },
  { key:"图形内容", label:"图形内容 (2D/3D/文字)", filter:c=>c.cat==="图形内容" },
  { key:"UI", label:"UI 系统", filter:c=>c.cat==="UI" },
  { key:"ECS", label:"ECS 实体组件系统", filter:c=>c.cat==="ECS" },
  { key:"辅助模块", label:"辅助模块", filter:c=>c.cat==="辅助模块" },
];

let activeCat = "all";

function renderCats() {
  catsEl.innerHTML = "";
  CATS.forEach(c => {
    const n = c.filter ? DATA.filter(c.filter).length : DATA.length;
    const b = document.createElement("button");
    b.className = c.key === activeCat ? "active" : "";
    b.innerHTML = `<span>${c.label}</span><span class="count">${n}</span>`;
    b.onclick = () => { activeCat = c.key; renderCats(); renderList(); };
    catsEl.appendChild(b);
  });
}

function escapeHtml(s) {
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function renderList() {
  const q = qEl.value.trim().toLowerCase();
  const cat = CATS.find(c => c.key === activeCat);
  let items = cat.filter ? DATA.filter(cat.filter) : DATA.slice();
  if (q) {
    items = items.filter(i =>
      (i.name+" "+i.file+" "+i.desc+" "+i.cat+" "+(i.tag||"")).toLowerCase().includes(q)
    );
  }
  // 按分类分组展示
  const groups = {};
  items.forEach(i => { (groups[i.cat] = groups[i.cat] || []).push(i); });
  statEl.textContent = `${items.length} / ${DATA.length} 条`;
  if (!items.length) { listEl.innerHTML = `<div class="empty">未找到匹配的 API，试试其他关键字（如 bloom / shadow / ui / ecs）</div>`; return; }
  let html = "";
  Object.keys(groups).forEach(g => {
    html += `<div class="group"><h2>${escapeHtml(g)}</h2><div class="grid">`;
    groups[g].forEach(i => {
      html += `<a class="card" href="${i.link}" title="打开文档：${escapeHtml(i.link)}">
        <div class="name">${escapeHtml(i.name)}</div>
        <div class="file">${escapeHtml(i.file)}</div>
        <div class="desc">${escapeHtml(i.desc)}</div>
        ${i.tag ? `<span class="tag">${escapeHtml(i.tag)}</span>` : ""}
      </a>`;
    });
    html += `</div></div>`;
  });
  listEl.innerHTML = html;
}

qEl.addEventListener("input", renderList);
renderCats();
renderList();
</script>
